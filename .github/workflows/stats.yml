name: Generate Profile Stats

on:
  schedule:
    - cron: "0 6 * * *"   # 1x por dia às 06:00 UTC
  workflow_dispatch: {}
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate stats SVGs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STATS_USERNAME: Henriquekr23
          OUT_DIR: assets
        run: python scripts/generate_stats.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/streak.svg assets/langs.svg assets/year.svg
          git diff --staged --quiet || git commit -m "chore: update profile stats [skip ci]"
          git push
